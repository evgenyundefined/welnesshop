location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Uploaded product photos live on a volume rather than inside the image, so
# they are mapped in explicitly instead of through the public/storage link.
location /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 30d;
    try_files $uri =404;
}

location ~ \.php$ {
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # Without this PHP cannot tell an https request from an http one, and
    # Laravel would mark session cookies insecure behind the TLS listener.
    fastcgi_param HTTPS $php_https if_not_empty;
    fastcgi_read_timeout 120;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }
